<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The y as the tonearm</title><style>*{box-sizing:border-box}body{margin:0;padding:40px 4%;background:#f7f4eb;color:#182936;font:16px/1.5 Helvetica,Arial,sans-serif}h1{font-size:30px;margin:0}header{margin-bottom:30px}header p{color:#52616c}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}article{background:#fffdf7;border:1px solid #deded5;border-radius:22px;text-align:center;padding:20px}article:first-child{border:2px solid #007f80}article p{color:#007f80;font-size:16px;margin:0 0 8px}h2{font-size:18px;margin:0}.large{display:block;width:136px;height:136px;margin:26px auto}.sizes{display:flex;align-items:center;justify-content:center;gap:18px;height:70px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>The y becomes the tonearm.</h1><p>Four minimal explorations. The descending stroke becomes the arm and stylus; the dot stays. No separate playhead added.</p></header><div class="grid"><article><p>OPTION 1</p><h2>Soft tonearm</h2><img class="large" src="y-tonearm-1.svg" alt="Soft tonearm"><div class="sizes"><img width="32" src="y-tonearm-1.svg" alt="Small logo"><img width="48" src="y-tonearm-1.svg" alt="Header logo"><img width="64" src="y-tonearm-1.svg" alt="Large logo"></div></article><article><p>OPTION 2</p><h2>Angled y</h2><img class="large" src="y-tonearm-2.svg" alt="Angled y"><div class="sizes"><img width="32" src="y-tonearm-2.svg" alt="Small logo"><img width="48" src="y-tonearm-2.svg" alt="Header logo"><img width="64" src="y-tonearm-2.svg" alt="Large logo"></div></article><article><p>OPTION 3</p><h2>Single flowing arm</h2><img class="large" src="y-tonearm-3.svg" alt="Single flowing arm"><div class="sizes"><img width="32" src="y-tonearm-3.svg" alt="Small logo"><img width="48" src="y-tonearm-3.svg" alt="Header logo"><img width="64" src="y-tonearm-3.svg" alt="Large logo"></div></article><article><p>OPTION 4</p><h2>Minimal bent y</h2><img class="large" src="y-tonearm-4.svg" alt="Minimal bent y"><div class="sizes"><img width="32" src="y-tonearm-4.svg" alt="Small logo"><img width="48" src="y-tonearm-4.svg" alt="Header logo"><img width="64" src="y-tonearm-4.svg" alt="Large logo"></div></article></div></body></html>
